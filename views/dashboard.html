<!-- Welcome Hero -->
<div class="welcome-hero">
    <div class="welcome-text">
        <h2 id="welcome-message">¡Hola, ...!</h2>
        <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px;">
            <p id="welcome-subtext" style="margin:0;">Rol en banda:</p>
            <span class="badge badge-primary" id="dashboard-user-role-badge">Miembro</span>
        </div>
    </div>
    <div class="welcome-date" id="dashboard-date">Cargando fecha...</div>
</div>

<!-- Dashboard Grid Layout -->
<div class="dashboard-grid">
    
    <!-- Next Event Card -->
    <div class="dashboard-card next-event-card">
        <div class="card-header">
            <h3>Próximo Evento</h3>
            <span class="badge badge-primary" id="next-event-badge">Cargando...</span>
        </div>
        <div class="card-body" id="next-event-content">
            <h4 id="next-event-name">Cargando evento...</h4>
            <div class="event-meta-info">
                <div class="meta-item">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <span id="next-event-date">...</span>
                </div>
                <div class="meta-item">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span id="next-event-time">...</span>
                </div>
            </div>
            <div class="event-roster-quick">
                <h5>Participación: <strong id="next-event-user-role">...</strong></h5>
            </div>
            <div class="card-actions-row">
                <button class="btn btn-outline btn-sm" id="view-next-event-setlist-btn">Ver Repertorio</button>
                <button class="btn btn-primary btn-sm" id="view-next-event-details-btn">Detalles Completos</button>
            </div>
        </div>
    </div>

    <!-- News & Notifications Feed -->
    <div class="dashboard-card notifications-card">
        <div class="card-header">
            <h3>Novedades y Anuncios</h3>
        </div>
        <div class="card-body scrollable-y max-h-300">
            <div class="notification-list" id="announcements-list">
                <!-- Mock announcements generated by JS -->
            </div>
        </div>
    </div>

    <!-- Quick Stats / Actions Grid -->
    <div class="quick-links-section">
        <h3>Acceso Rápido</h3>
        <div class="quick-links-grid">
            <a href="#songs" class="quick-link-box" data-nav="songs">
                <div class="icon-wrap color-purple">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                </div>
                <span>Letras & Acordes</span>
            </a>
            <a href="#setlists" class="quick-link-box" data-nav="setlists">
                <div class="icon-wrap color-cyan">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M3 20v-8a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v8"/><path d="M3 10V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v6"/><path d="M14 14V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v10"/></svg>
                </div>
                <span>Ver Repertorios</span>
            </a>
            <a href="#suggestions" class="quick-link-box" data-nav="suggestions">
                <div class="icon-wrap color-green">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </div>
                <span>Proponer Canción</span>
            </a>
            <a href="#events" class="quick-link-box" data-nav="events">
                <div class="icon-wrap color-orange">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                </div>
                <span>Ver Calendario</span>
            </a>
        </div>
    </div>

</div>
