<!-- Sub-panel 1: Catalog List -->
<div id="subpanel-songs-list" class="sub-view">
    <div class="action-bar">
        <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="songs-search-input" placeholder="Buscar por título, artista o tono...">
        </div>
        <button class="btn btn-primary" id="btn-add-song" style="display: none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Añadir</span>
        </button>
    </div>

    <!-- Songs List -->
    <div class="songs-grid" id="songs-catalog-list">
        <!-- Songs cards generated by JS -->
    </div>
</div>

<!-- Sub-panel 2: Song Detail View (Lyrics & Chords) -->
<div id="subpanel-song-detail" class="sub-view hidden">

    <!-- Fixed zone: Navigation + Song Info + Controls -->
    <div class="song-detail-fixed">
        <!-- Navigation Back Header -->
        <div class="detail-header-nav">
            <button class="btn-back" id="back-to-songs">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                <span>Volver a Canciones</span>
            </button>
            <div class="song-header-links" id="song-media-links">
                <!-- Redirection link to Youtube/Spotify -->
            </div>
        </div>

        <!-- Song meta + tonality -->
        <div class="song-meta-header">
            <div>
                <h2 class="song-detail-title" id="song-detail-title">...</h2>
                <p class="song-detail-artist" id="song-detail-artist">...</p>
            </div>
            <div class="song-tonality-badge">
                <span class="label">Tono original:</span>
                <span class="value" id="song-detail-original-key">-</span>
            </div>
        </div>

        <!-- Control Panel: Transpose & Scroll -->
        <div class="song-controls-bar">
            <div class="control-group">
                <label class="control-label">Tono:</label>
                <div class="transpose-widget">
                    <button class="btn btn-control btn-sm" id="btn-transpose-down" title="Bajar semitono">-</button>
                    <span class="current-key-display" id="song-current-key">-</span>
                    <button class="btn btn-control btn-sm" id="btn-transpose-up" title="Subir semitono">+</button>
                </div>
                <button class="btn btn-outline btn-sm" id="btn-transpose-reset" title="Restaurar tono original">
                    <span class="btn-text-long">Restaurar</span>
                    <span class="btn-text-short">Rest.</span>
                </button>
            </div>

            <div class="control-group scroll-group">
                <label class="control-label">Scroll:</label>
                <div class="scroll-widget">
                    <button class="btn btn-control btn-sm" id="btn-scroll-toggle" title="Iniciar/Pausar autoscroll"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg></button>
                    <select id="scroll-speed-select" class="form-select-sm">
                        <option value="1">x1</option>
                        <option value="2" selected>x2</option>
                        <option value="3">x3</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Scrollable lyrics zone: full width, no card -->
    <div class="lyrics-view-wrapper" id="lyrics-container">
        <pre class="chords-lyrics-pre" id="chords-lyrics-content">
            <!-- Populated dynamically -->
        </pre>
    </div>

</div>


<!-- ================= MODALS SECTION ================= -->
<!-- ADD/EDIT SONG MODAL -->
<div class="modal-backdrop hidden" id="modal-song">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="song-modal-title">Agregar Nueva Canción</h3>
            <button class="btn-close-modal" id="btn-close-song-modal-x">&times;</button>
        </div>
        <form id="song-form">
            <input type="hidden" id="song-form-id">
            <input type="hidden" id="song-form-suggestion-id">
            <div class="form-row">
                <div class="form-group col-8">
                    <label for="song-form-title">Nombre de la Canción</label>
                    <input type="text" id="song-form-title" placeholder="Ej. Yellow" required>
                </div>
                <div class="form-group col-4">
                    <label for="song-form-key">Tono Base</label>
                    <input type="text" id="song-form-key" placeholder="Ej. G o C" required>
                </div>
            </div>
            <div class="form-group">
                <label for="song-form-artist">Artista / Banda</label>
                <input type="text" id="song-form-artist" placeholder="Ej. Coldplay" required>
            </div>
            <div class="form-group">
                <label for="song-form-url">Enlace a Video o Audio (YouTube, Spotify, etc.)</label>
                <input type="url" id="song-form-url" placeholder="https://youtube.com/watch?v=...">
            </div>
            <div class="form-group">
                <label for="song-form-content">Letra con Acordes entre Corchetes [ ]</label>
                <textarea id="song-form-content" rows="10" placeholder="Ejemplo:&#10;[G] Te amo, [C] tu amor no [G] me falla...&#10;[D/F#] En tus [Em] manos..."></textarea>
                <small class="form-help">Coloca los acordes justo antes de la sílaba correspondiente encerrándolos entre corchetes, ej: [C], [Am], [F], [G]. Esto permitirá transportarlos automáticamente. Coloca un # al inicio de una seccion instrumental.</small>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="btn-delete-song" style="color:var(--danger); border-color:rgba(239,68,68,0.2); margin-right:auto; display:none;">Eliminar Canción</button>
                <button type="button" class="btn btn-outline btn-close-modal" id="btn-close-song-modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </form>
    </div>
</div>
