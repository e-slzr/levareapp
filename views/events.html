<!-- Top Header with Toggle Switch for List/Calendar -->
<div class="events-navigation-bar">
    <div class="view-toggle-wrap">
        <button class="btn-toggle active" id="toggle-view-list">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            <span>Lista</span>
        </button>
        <button class="btn-toggle" id="toggle-view-calendar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span>Calendario</span>
        </button>
    </div>
    <button class="btn btn-primary" id="btn-schedule-event" style="display: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>Programar Evento</span>
    </button>
</div>

<!-- VIEW 5A: EVENTS LIST -->
<div id="events-list-wrapper" class="events-list-wrapper">
    <div class="events-list" id="events-list-container">
        <!-- Dynamic events list -->
    </div>
</div>

<!-- VIEW 5B: EVENTS CALENDAR -->
<div id="events-calendar-wrapper" class="events-calendar-wrapper hidden">
    <div class="calendar-card">
        <div class="calendar-header">
            <button class="btn-calendar-nav" id="btn-prev-month">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <h3 id="calendar-month-year">Junio 2026</h3>
            <button class="btn-calendar-nav" id="btn-next-month">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
        </div>
        <div class="calendar-weekdays">
            <div>Dom</div>
            <div>Lun</div>
            <div>Mar</div>
            <div>Mié</div>
            <div>Jue</div>
            <div>Vie</div>
            <div>Sáb</div>
        </div>
        <div class="calendar-grid" id="calendar-grid-cells">
            <!-- Calendar days generated dynamically -->
        </div>
    </div>
</div>



<!-- SCHEDULE EVENT MODAL -->
<div class="modal-backdrop hidden" id="modal-schedule-event">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Programar Evento o Ensayo</h3>
            <button class="btn-close-modal" id="btn-close-schedule-event-modal-x">&times;</button>
        </div>
        <form id="event-schedule-form">
            <div class="form-group">
                <label for="event-form-name">Nombre del Evento</label>
                <input type="text" id="event-form-name" placeholder="Ej. Servicio de Jóvenes" required>
            </div>
            <div class="form-row">
                <div class="form-group col-6">
                    <label for="event-form-date">Fecha</label>
                    <input type="date" id="event-form-date" required>
                </div>
                <div class="form-group col-6">
                    <label for="event-form-time">Hora</label>
                    <input type="time" id="event-form-time" required>
                </div>
            </div>
            <div class="form-group">
                <label for="event-form-type">Tipo de Evento</label>
                <select id="event-form-type" required>
                    <!-- Populated dynamically from EVENT_TYPES in utils.js -->
                </select>
            </div>
            <div class="form-group">
                <label for="event-form-desc">Descripción / Notas</label>
                <input type="text" id="event-form-desc" placeholder="Ej. Llegar 30 mins antes de empezar">
            </div>
            <div class="form-group">
                <label for="event-form-setlist">Asignar Repertorio</label>
                <select id="event-form-setlist" required>
                    <option value="" disabled selected>Selecciona un repertorio...</option>
                    <!-- Populated dynamically -->
                </select>
            </div>

            <!-- Musician Assignment (Roster) -->
            <div class="form-group">
                <label>Asignación de Músicos para el Evento</label>
                <p class="form-subtitle">Selecciona quién cubrirá cada rol en este evento:</p>
                <div class="roster-setup-list" id="event-form-roster-selection" style="display:flex; flex-direction:column; gap:10px; border:1px solid var(--border-color); border-radius:var(--radius-md); padding:10px; background-color:var(--bg-input); max-height: 200px; overflow-y: auto;">
                    <!-- Loaded dynamically with musician dropdowns per role -->
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-outline btn-close-modal" id="btn-close-schedule-event-modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Programar</button>
            </div>
        </form>
    </div>
</div>
