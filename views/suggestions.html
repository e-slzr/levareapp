<div class="suggestion-intro" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom: 20px;">
    <p style="margin:0; flex:1; min-width:240px; color:var(--text-muted);">¿Tienes una canción en mente para ensayar próximamente? Proponla aquí para que la banda pueda verla y votar.</p>
    <button class="btn btn-primary" id="btn-add-suggestion">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>Nueva Sugerencia</span>
    </button>
</div>

<!-- Filtros de Sugerencias -->
<div class="suggestion-filters" style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; background: var(--bg-card); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border-color); align-items: center;">
    <div style="flex: 2; min-width: 200px;">
        <input type="text" id="suggestions-filter-song" placeholder="Buscar por canción o artista...">
    </div>
    <div style="flex: 1.5; min-width: 150px;">
        <input type="text" id="suggestions-filter-author" placeholder="Sugerido por...">
    </div>
    <div style="flex: 1; min-width: 130px;">
        <select id="suggestions-filter-status" style="width: 100%;">
            <option value="all">Todos los estados</option>
            <option value="pendiente">Sugeridas</option>
            <option value="agregada">Agregadas</option>
        </select>
    </div>
</div>

<div class="suggestions-list" id="suggestions-container-list" style="display:flex; flex-direction:column; gap:16px;">
    <!-- Suggestions populated dynamically -->
</div>

<!-- ================= MODALS ================= -->
<!-- ADD SUGGESTION MODAL -->
<div class="modal-backdrop hidden" id="modal-suggestion">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Sugerir Nueva Canción</h3>
            <button class="btn-close-modal" id="btn-close-suggestion-modal-x">&times;</button>
        </div>
        <form id="suggestion-form">
            <div class="form-group">
                <label for="suggestion-form-title">Título de la Canción</label>
                <input type="text" id="suggestion-form-title" placeholder="Ej. Yellow" required>
            </div>
            <div class="form-group">
                <label for="suggestion-form-artist">Artista / Banda</label>
                <input type="text" id="suggestion-form-artist" placeholder="Ej. Coldplay" required>
            </div>
            <div class="form-group">
                <label for="suggestion-form-url">Enlace a Video / Audio (YouTube, Spotify)</label>
                <input type="url" id="suggestion-form-url" placeholder="https://youtube.com/...">
            </div>
            <div class="form-group">
                <label for="suggestion-form-notes">Notas o Justificación</label>
                <textarea id="suggestion-form-notes" rows="4" placeholder="¿Por qué deberíamos ensayar esta canción? Ej. Sería genial tocarla para abrir el concierto..."></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline btn-close-modal" id="btn-close-suggestion-modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Sugerir</button>
            </div>
        </form>
    </div>
</div>

<!-- DELETE SUGGESTION CONFIRMATION MODAL -->
<div class="modal-backdrop hidden" id="modal-delete-suggestion-confirm">
    <div class="modal-card" style="max-width: 400px;">
        <div class="modal-header">
            <h3>Eliminar Sugerencia</h3>
            <button class="btn-close-modal" id="btn-close-delete-suggestion-modal-x">&times;</button>
        </div>
        <div style="padding: 20px 24px;">
            <p style="font-size: 0.95rem; color: var(--text-secondary);">¿Estás seguro de que deseas eliminar esta sugerencia de canción? Esta acción no se puede deshacer y retirará la propuesta de la lista.</p>
        </div>
        <div class="modal-footer" style="display: flex; gap: 10px; justify-content: flex-end;">
            <button type="button" class="btn btn-outline btn-close-modal" id="btn-close-delete-suggestion-modal">Cancelar</button>
            <button type="button" class="btn btn-danger" id="btn-confirm-delete-suggestion">Eliminar</button>
        </div>
    </div>
</div>
