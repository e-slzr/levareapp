<div class="auth-card group-selector-card">
    <div class="auth-header">
        <div class="logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2A10 10 0 0 0 2 12a10 10 0 0 0 10 10c1.7 0 3.2-.4 4.5-1.1L22 22l-1.1-5.5c.7-1.3 1.1-2.8 1.1-4.5A10 10 0 0 0 12 2z"/><path d="M12 7v10"/><path d="M8 11h8"/></svg>
            <span>Levare</span>
        </div>
        <h1>Selecciona una Banda</h1>
        <p>Elige con cuál de tus bandas deseas trabajar hoy.</p>
    </div>

    <!-- Groups list loaded dynamically by group-selector.js -->
    <div class="groups-selector-list" id="groups-selection-container" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; max-height: 250px; overflow-y: auto; padding: 2px;">
        <!-- Populated via JS -->
    </div>

    <div style="border-top: 1px solid var(--border-color); padding-top: 15px; margin-top: 15px;">
        <button type="button" class="btn btn-outline btn-block" id="btn-selector-add-group">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Agregar o unirme a otra banda</span>
        </button>
    </div>
</div>
